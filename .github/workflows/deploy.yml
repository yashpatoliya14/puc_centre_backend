name: Deploy Backend to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Pull, Build & Restart Backend via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            export PATH="$PATH:/usr/local/bin:/usr/bin:$HOME/.npm-global/bin"
            [ -s "$HOME/.nvm/nvm.sh" ] && . "$HOME/.nvm/nvm.sh"

            cd /var/www/puc_centre_backend
            git pull origin main
            npm install --no-audit --no-fund
            npm run build

            if pm2 describe puc-backend > /dev/null 2>&1; then
              pm2 restart puc-backend --update-env
            else
              pm2 start dist/main.js --name puc-backend
            fi

            pm2 save
            pm2 status puc-backend
